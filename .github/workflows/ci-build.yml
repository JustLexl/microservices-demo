name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Job de compilación y subida a Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - adservice
          - checkoutservice
          - currencyservice
          - emailservice
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
          - shoppingassistantservice
          - cartservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push microservices
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'cartservice' && 'src/cartservice' || format('src/{0}', matrix.service) }}
          file: ${{ matrix.service == 'cartservice' && 'src/cartservice/src/Dockerfile' || format('src/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: alexanderdelabarrera/${{ matrix.service }}:latest

  # 2. Job de Deploy en tu Runner local (Windows)
  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Helm
        shell: powershell
        run: |
          helm upgrade --install online-boutique ./helm-chart `
            --set images.repository=alexanderdelabarrera `
            --set images.tag=latest